<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitil Makine Detay Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 pb-12">

    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🖥️</span>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight">Fitil Makine Detay Paneli</h1>
            </div>
            <!-- DİNAMİK YÖNLENDİRME BUTONLARI -->
            <div class="flex items-center gap-2">
                <a href="index.html" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-md">
                    📝 Veri Girişi
                </a>
                <a href="rapor.html" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-md">
                    📊 Raporlar
                </a>
                <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-md">
                    🚪 Çıkış
                </button>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 mt-8 space-y-6">
        <div class="glass-card p-6 rounded-2xl">
            <h2 class="text-base font-bold text-slate-800 mb-4 pb-2 border-b">
                🖥️ Makine Seçimi ve Detay Analizi
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Makine Seçiniz</label>
                    <select id="selectMachineDetail" onchange="loadMachineData()" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <script>
                            for(let i=1; i<=16; i++) {
                                document.write(`<option value="Fitil - ${i}">Fitil - ${i}</option>`);
                            }
                        </script>
                    </select>
                </div>
            </div>
        </div>

        <div class="glass-card p-6 rounded-2xl">
            <h3 id="machineTitle" class="text-lg font-bold text-slate-800 mb-4">Fitil - 1 Geçmiş Kayıtları</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-center border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-800 text-white font-bold text-xs uppercase">
                            <th class="p-3">Tarih</th>
                            <th class="p-3">Saat</th>
                            <th class="p-3">Vardiya</th>
                            <th class="p-3">Usta</th>
                            <th class="p-3">Operatör</th>
                            <th class="p-3">Randıman (%)</th>
                            <th class="p-3">Açıklama</th>
                        </tr>
                    </thead>
                    <tbody id="machineLogsBody" class="divide-y divide-gray-200 text-xs font-medium">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex flex-col items-center justify-center text-white z-50">
        <div class="w-10 h-10 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="font-semibold text-sm">Veriler Okunuyor...</p>
    </div>

    <script>
        const SPREADSHEET_ID = "16tz3byec8CEmoLvT7PJl_tK9rhnHxnl7uyyYEv_yGxI";
        let allMachineLogs = [];

        document.addEventListener("DOMContentLoaded", function() {
            // Yetki Kontrolü
            const savedUser = localStorage.getItem("fitil_active_user");
            if (!savedUser) {
                window.location.href = "index.html";
                return;
            }
            const user = JSON.parse(savedUser);
            if (user.role !== "admin") {
                alert("⛔ Bu sayfaya erişim yetkiniz bulunmamaktadır.");
                window.location.href = "index.html";
                return;
            }

            fetchMachineLogs();
        });

        function handleLogout() {
            localStorage.removeItem("fitil_active_user");
            window.location.href = "index.html";
        }

        function fetchMachineLogs() {
            showLoading(true);
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json`;

            fetch(url)
                .then(res => res.text())
                .then(rep => {
                    const jsonString = rep.substring(47, rep.length - 2);
                    const json = JSON.parse(jsonString);
                    parseGVizRows(json.table.rows);
                })
                .catch(err => console.error("Veri hatası:", err))
                .finally(() => showLoading(false));
        }

        function parseGVizRows(rows) {
            allMachineLogs = [];
            if (rows) {
                rows.forEach(r => {
                    const c = r.c;
                    if (c && c[0] && c[0].v !== null && c[0].v !== undefined) {
                        let rawDate = c[0].f || c[0].v;
                        if (typeof rawDate === 'string' && rawDate.includes("Date(")) {
                            const dateParts = rawDate.match(/\d+/g);
                            if (dateParts) {
                                const year = dateParts[0];
                                const month = String(parseInt(dateParts[1]) + 1).padStart(2, '0');
                                const day = String(dateParts[2]).padStart(2, '0');
                                rawDate = `${year}-${month}-${day}`;
                            }
                        }

                        allMachineLogs.push({
                            dateStr: String(rawDate).split('T')[0],
                            timeStr: c[1] ? c[1].v : "-",
                            shift: c[2] ? c[2].v : "-",
                            master: c[3] ? c[3].v : "-",
                            machine: c[4] ? c[4].v : "-",
                            operator: c[5] ? c[5].v : "-",
                            efficiency: c[6] ? parseFloat(c[6].v) || 0 : 0,
                            description: c[7] ? c[7].v : "-"
                        });
                    }
                });
            }
            loadMachineData();
        }

        function loadMachineData() {
            const selectedM = document.getElementById("selectMachineDetail").value;
            document.getElementById("machineTitle").textContent = `${selectedM} Geçmiş Kayıtları`;

            const filtered = allMachineLogs.filter(item => item.machine === selectedM);
            const tbody = document.getElementById("machineLogsBody");
            tbody.innerHTML = "";

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-gray-400">Bu makineye ait kayıt bulunamadı.</td></tr>`;
                return;
            }

            filtered.reverse().forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition border-b border-gray-100";
                tr.innerHTML = `
                    <td class="p-2.5 font-semibold text-slate-700">${item.dateStr}</td>
                    <td class="p-2.5 text-gray-600">${item.timeStr}</td>
                    <td class="p-2.5 text-gray-600">${item.shift}</td>
                    <td class="p-2.5 text-gray-700 font-medium">${item.master}</td>
                    <td class="p-2.5 text-gray-700 font-medium">${item.operator}</td>
                    <td class="p-2.5 font-bold ${getTailwindBg(item.efficiency)}">%${item.efficiency.toFixed(1)}</td>
                    <td class="p-2.5 text-gray-500 italic">${item.description}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getTailwindBg(val) {
            if (val >= 70) return "text-emerald-600";
            if (val >= 60) return "text-amber-600";
            return "text-rose-600";
        }

        function showLoading(show) {
            document.getElementById("loadingOverlay").style.display = show ? "flex" : "none";
        }
    </script>
</body>
</html>

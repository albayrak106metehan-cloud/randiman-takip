<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitil Randıman Veri Giriş Paneli</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 pb-12">

    <!-- Üst Bar / Header -->
    <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <span class="text-2xl">📝</span>
                <h1 class="text-xl md:text-2xl font-bold tracking-tight">Fitil Veri Giriş Paneli</h1>
            </div>
            <!-- DOĞRUDAN SAYFA GEÇİŞ BUTONLARI -->
            <div class="flex items-center gap-2">
                <a href="makineler.html" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg transition shadow-md flex items-center gap-1.5">
                    🖥️ Makineler
                </a>
                <a href="rapor.html" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs md:text-sm font-semibold px-4 py-2 rounded-lg transition shadow-md flex items-center gap-1.5">
                    📊 Raporlar
                </a>
            </div>
        </div>
    </header>

    <div class="max-w-3xl mx-auto px-4 mt-8 space-y-6">

        <!-- VERİ GİRİŞ FORMU -->
        <div class="glass-card p-6 md:p-8 rounded-2xl">
            <h2 class="text-lg font-bold text-slate-800 border-b border-gray-100 pb-3 mb-6 flex items-center gap-2">
                📌 Randıman Kayıt Formu
            </h2>

            <form id="entryForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Tarih</label>
                        <input type="date" id="inputDate" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Saat</label>
                        <input type="time" id="inputTime" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Vardiya Seçimi</label>
                        <select id="selectShift" onchange="checkShiftDateAdjustment()" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">Vardiya Seçiniz</option>
                            <option value="1. Vardiya (08:00 - 16:00)">1. Vardiya (08:00 - 16:00)</option>
                            <option value="2. Vardiya (16:00 - 24:00)">2. Vardiya (16:00 - 24:00)</option>
                            <option value="3. Vardiya (00:00 - 08:00)">3. Vardiya (00:00 - 08:00)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Vardiya Ustası</label>
                        <input type="text" id="inputMaster" placeholder="Usta Adı Soyadı" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Fitil Makinesi</label>
                        <select id="selectMachine" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">Makine Seçiniz</option>
                            <!-- 1-16 Fitil Makineleri -->
                            <script>
                                for(let i=1; i<=16; i++) {
                                    document.write(`<option value="Fitil - ${i}">Fitil - ${i}</option>`);
                                }
                            </script>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Operatör</label>
                        <input type="text" id="inputOperator" placeholder="Operatör Adı Soyadı" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Randıman (%)</label>
                        <input type="number" step="0.1" min="0" max="100" id="inputEfficiency" placeholder="Örn: 85.5" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 mb-1">Açıklama / Not (İsteğe Bağlı)</label>
                        <input type="text" id="inputDescription" placeholder="Varsa arıza veya not..." class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                        <span>💾 Kaydet ve E-Tablo'ya Gönder</span>
                    </button>
                </div>
            </form>
        </div>

    </div>

    <!-- Yükleniyor Göstergesi -->
    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex flex-col items-center justify-center text-white z-50 hidden">
        <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p id="loadingText" class="font-semibold text-base">Veri Kaydediliyor...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwt3X5x7l3H2YdF3A-8t-zL7G-Pj-L_9a8X9X9/exec";

        document.addEventListener("DOMContentLoaded", function() {
            setInitialDateTime();
        });

        function setInitialDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById("inputDate").value = `${year}-${month}-${day}`;
            document.getElementById("inputTime").value = `${hours}:${minutes}`;
        }

        function checkShiftDateAdjustment() {
            const shiftVal = document.getElementById("selectShift").value;
            const dateInput = document.getElementById("inputDate");

            if (shiftVal.includes("3. Vardiya")) {
                const currentDate = new Date(dateInput.value || new Date());
                currentDate.setDate(currentDate.getDate() - 1);

                const year = currentDate.getFullYear();
                const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                const day = String(currentDate.getDate()).padStart(2, '0');

                dateInput.value = `${year}-${month}-${day}`;
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            showLoading(true, "E-Tablo'ya Kaydediliyor...");

            const formData = {
                date: document.getElementById("inputDate").value,
                time: document.getElementById("inputTime").value,
                shift: document.getElementById("selectShift").value,
                master: document.getElementById("inputMaster").value,
                machine: document.getElementById("selectMachine").value,
                operator: document.getElementById("inputOperator").value,
                efficiency: document.getElementById("inputEfficiency").value,
                description: document.getElementById("inputDescription").value || "-"
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(() => {
                showLoading(false);
                alert("✅ Veri başarıyla kaydedildi!");
                document.getElementById("entryForm").reset();
                setInitialDateTime();
            })
            .catch(err => {
                console.error("Kayıt Hatası:", err);
                showLoading(false);
                alert("❌ Kayıt sırasında bir hata oluştu.");
            });
        }

        function showLoading(show, text = "") {
            const overlay = document.getElementById("loadingOverlay");
            document.getElementById("loadingText").textContent = text;
            overlay.classList.toggle("hidden", !show);
        }
    </script>
</body>
</html>

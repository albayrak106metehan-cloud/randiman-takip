<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitil Makineleri Takip Paneli</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 pb-12">

    <!-- Üst Bar / Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                ⚡ Fitil Makineleri Randıman Takip Paneli
            </h1>
            <span id="liveClock" class="text-xs md:text-sm bg-indigo-800 px-3 py-1 rounded-full text-indigo-200"></span>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Sol Kolon: Veri Giriş Formu -->
        <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold text-gray-700 mb-4 pb-2 border-b flex items-center gap-2">
                📝 Vardiya Veri Girişi
            </h2>
            
            <form id="entryForm" onsubmit="saveEntry(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Tarih</label>
                    <input type="date" id="inputDate" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Vardiya</label>
                    <select id="inputShift" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Vardiya Seçiniz</option>
                        <option value="1. Vardiya (08:00 - 16:00)">1. Vardiya (08:00 - 16:00)</option>
                        <option value="2. Vardiya (16:00 - 24:00)">2. Vardiya (16:00 - 24:00)</option>
                        <option value="3. Vardiya (00:00 - 08:00)">3. Vardiya (00:00 - 08:00)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Makine Seçimi</label>
                    <select id="inputMachine" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="">Makine Seçiniz</option>
                        <!-- Fitil - 1'den Fitil - 16'ya Kadar Otomatik Eklenecek -->
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Operatör / Usta</label>
                    <input type="text" id="inputOperator" placeholder="Örn: Ahmet Usta" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Randıman (%)</label>
                    <input type="number" id="inputEfficiency" min="0" max="100" step="0.1" placeholder="Örn: 85.5" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Açıklama / Duruş Notu</label>
                    <textarea id="inputDescription" rows="2" placeholder="Varsa arıza, duruş nedeni veya not yazın..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow transition duration-200 flex items-center justify-center gap-2">
                    <span>Kaydet ve E-Tabloya Gönder</span>
                </button>
            </form>

            <div id="statusMessage" class="hidden mt-4 p-3 rounded-lg text-sm font-medium text-center"></div>
        </div>

        <!-- Sağ Kolon: Makine Durum Kartları ve Son Girişler -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Özet İstatistikler -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <span class="text-xs text-gray-500 font-semibold uppercase">Toplam Makine</span>
                    <p class="text-2xl font-bold text-indigo-600 mt-1">16</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <span class="text-xs text-gray-500 font-semibold uppercase">Son Kayıt</span>
                    <p id="statLastEntry" class="text-lg font-bold text-gray-700 mt-1">-</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <span class="text-xs text-gray-500 font-semibold uppercase">Ortalama Randıman</span>
                    <p id="statAvgEfficiency" class="text-2xl font-bold text-emerald-600 mt-1">%0</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 text-center">
                    <span class="text-xs text-gray-500 font-semibold uppercase">Veritabanı</span>
                    <p class="text-sm font-bold text-green-600 mt-2 flex items-center justify-center gap-1">
                        <span class="w-2 h-2 bg-green-500 rounded-full animate-ping"></span> Google Sheets
                    </p>
                </div>
            </div>

            <!-- Son Kaydedilen Veriler Listesi -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold text-gray-700 mb-4 pb-2 border-b flex justify-between items-center">
                    <span>📊 Cihazdaki Son Kayıtlar</span>
                    <span class="text-xs font-normal text-gray-500">(Tüm geçmiş Google E-Tablonuzda birikir)</span>
                </h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50 text-gray-600 uppercase text-xs">
                            <tr>
                                <th class="p-3">Tarih</th>
                                <th class="p-3">Vardiya</th>
                                <th class="p-3">Makine</th>
                                <th class="p-3">Operatör</th>
                                <th class="p-3">Randıman</th>
                                <th class="p-3">Not</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTable" class="divide-y divide-gray-100">
                            <tr>
                                <td colspan="6" class="p-4 text-center text-gray-400">Henüz kayıt girilmedi.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
        // Google Apps Script Web App URL
        const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbymipY1Hd3AIqGw9o-9jb2_1bh_HQi0kea5p2vH6M9VneEOv1dv4NcpxMqJ4b0X57OB/exec";

        // Sayfa Yüklendiğinde
        document.addEventListener("DOMContentLoaded", function() {
            initMachines();
            setCurrentDate();
            startClock();
            loadLocalRecords();
        });

        // 16 Makineyi 'Fitil - X' Olarak Select Kutusu İçine Ekle
        function initMachines() {
            const select = document.getElementById("inputMachine");
            for (let i = 1; i <= 16; i++) {
                const opt = document.createElement("option");
                opt.value = `Fitil - ${i}`;
                opt.textContent = `Fitil - ${i}`;
                select.appendChild(opt);
            }
        }

        // Bugünün Tarihini Varsayılan Ayarla
        function setCurrentDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("inputDate").value = today;
        }

        // Canlı Saat
        function startClock() {
            setInterval(() => {
                const now = new Date();
                document.getElementById("liveClock").textContent = now.toLocaleString("tr-TR");
            }, 1000);
        }

        // Form Gönderme İşlemi
        async function saveEntry(event) {
            event.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            const statusMsg = document.getElementById("statusMessage");

            const dateVal = document.getElementById("inputDate").value;
            const shiftVal = document.getElementById("inputShift").value;
            const machineVal = document.getElementById("inputMachine").value;
            const operatorVal = document.getElementById("inputOperator").value;
            const efficiencyVal = parseFloat(document.getElementById("inputEfficiency").value);
            const descriptionVal = document.getElementById("inputDescription").value;

            const now = new Date();
            const timeStr = now.toLocaleTimeString("tr-TR");

            const payload = {
                dateStr: dateVal,
                timeStr: timeStr,
                shift: shiftVal,
                machine: machineVal,
                operator: operatorVal,
                efficiency: efficiencyVal,
                description: descriptionVal || "-"
            };

            // Butonu yükleniyor moduna al
            submitBtn.disabled = true;
            submitBtn.classList.add("opacity-60");
            submitBtn.innerHTML = `<span>Kaydediliyor ve Gönderiliyor...</span>`;

            try {
                // 1. Google E-Tablolar'a Gönder
                await fetch(GOOGLE_SHEETS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                // 2. Cihazın kendi yerel hafızasına da ekle
                saveToLocalStorage(payload);

                // Başarı Mesajı Göster
                statusMsg.className = "mt-4 p-3 rounded-lg text-sm font-medium text-center bg-green-100 text-green-700 block";
                statusMsg.textContent = "✅ Veri başarıyla kaydedildi ve Google E-Tablo'ya iletildi!";

                // Formu Sıfırla
                document.getElementById("inputEfficiency").value = "";
                document.getElementById("inputDescription").value = "";

            } catch (err) {
                console.error("Hata:", err);
                statusMsg.className = "mt-4 p-3 rounded-lg text-sm font-medium text-center bg-red-100 text-red-700 block";
                statusMsg.textContent = "❌ Veri gönderilirken bir hata oluştu!";
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove("opacity-60");
                submitBtn.innerHTML = `<span>Kaydet ve E-Tabloya Gönder</span>`;

                setTimeout(() => {
                    statusMsg.className = "hidden";
                }, 4000);
            }
        }

        // Yerel Hafızaya (localStorage) Kayıt
        function saveToLocalStorage(record) {
            let records = JSON.parse(localStorage.getItem("fitilRecords") || "[]");
            records.unshift(record); // En yeni kaydı üste ekle
            if (records.length > 20) records.pop(); // Son 20 kaydı tut
            localStorage.setItem("fitilRecords", JSON.stringify(records));
            loadLocalRecords();
        }

        // Yerel Kayıtları Tabloya Bas
        function loadLocalRecords() {
            let records = JSON.parse(localStorage.getItem("fitilRecords") || "[]");
            const tbody = document.getElementById("recordsTable");

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">Henüz kayıt girilmedi.</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            let totalEff = 0;

            records.forEach(r => {
                totalEff += r.efficiency;
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50 transition";

                // Randıman rengi belirleme
                let effBadgeClass = "bg-green-100 text-green-700";
                if (r.efficiency < 75) effBadgeClass = "bg-red-100 text-red-700";
                else if (r.efficiency < 85) effBadgeClass = "bg-yellow-100 text-yellow-700";

                tr.innerHTML = `
                    <td class="p-3 font-medium">${r.dateStr}</td>
                    <td class="p-3 text-xs text-gray-500">${r.shift}</td>
                    <td class="p-3 font-semibold text-indigo-700">${r.machine}</td>
                    <td class="p-3">${r.operator}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${effBadgeClass}">%${r.efficiency}</span></td>
                    <td class="p-3 text-xs text-gray-500 max-w-[150px] truncate" title="${r.description}">${r.description}</td>
                `;
                tbody.appendChild(tr);
            });

            // İstatistikleri Güncelle
            document.getElementById("statLastEntry").textContent = records[0].machine;
            const avg = (totalEff / records.length).toFixed(1);
            document.getElementById("statAvgEfficiency").textContent = `%${avg}`;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitil Randıman Paneli - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; }
        .glass-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body class="font-sans antialiased text-gray-800 pb-12">

    <!-- LOGIN EKRANI -->
    <div id="loginSection" class="min-h-screen flex items-center justify-center px-4">
        <div class="glass-card p-8 rounded-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <span class="text-4xl">🔐</span>
                <h2 class="text-xl font-bold text-slate-800 mt-2">Sisteme Giriş Yapın</h2>
                <p class="text-xs text-gray-500 mt-1">Lütfen kullanıcı adı ve şifrenizi girin</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Kullanıcı Adı</label>
                    <input type="text" id="loginUsername" required placeholder="Kullanıcı adınız..." class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 mb-1">Şifre</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                    Giriş Yap
                </button>
            </form>
        </div>
    </div>

    <!-- ANA PANEL -->
    <div id="appSection" class="hidden">
        <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📝</span>
                    <div>
                        <h1 class="text-lg md:text-xl font-bold tracking-tight">Fitil Veri Giriş Paneli</h1>
                        <p class="text-[11px] text-indigo-300">Giriş Yapan: <span id="currentUserSpan" class="font-bold text-white"></span> (<span id="userRoleSpan" class="text-emerald-400"></span>)</p>
                    </div>
                </div>
                <!-- Sağ Üst Navigasyon Menüsü (Rol Bazlı Dinamik) -->
                <div id="headerNavLinks" class="flex items-center gap-2">
                    <!-- JS Tarafından Doldurulacak -->
                </div>
            </div>
        </header>

        <div class="max-w-4xl mx-auto px-4 mt-8 space-y-6">
            <!-- KAYIT FORMU -->
            <div class="glass-card p-6 md:p-8 rounded-2xl relative">
                <h2 class="text-lg font-bold text-slate-800 border-b border-gray-100 pb-3 mb-6 flex items-center justify-between">
                    <span id="formTitle">📌 Randıman Kayıt Formu</span>
                    <button id="btnCancelEdit" type="button" onclick="cancelEditMode()" class="hidden text-xs bg-rose-100 text-rose-700 px-2.5 py-1 rounded-lg font-semibold hover:bg-rose-200 transition">Düzenlemeden Vazgeç</button>
                </h2>

                <div id="successBanner" class="hidden mb-6 bg-emerald-50 border border-emerald-200 text-emerald-800 px-4 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 transition-all">
                    <span>✅</span>
                    <span id="successMessage">İşlem başarıyla gerçekleştirildi!</span>
                </div>

                <form id="entryForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="editRowIndex" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Tarih</label>
                            <input type="date" id="inputDate" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Saat</label>
                            <input type="time" id="inputTime" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Vardiya Seçimi</label>
                            <select id="selectShift" onchange="checkShiftDateAdjustment()" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="">Vardiya Seçiniz</option>
                                <option value="1. Vardiya (08:00 - 16:00)">1. Vardiya (08:00 - 16:00)</option>
                                <option value="2. Vardiya (16:00 - 24:00)">2. Vardiya (16:00 - 24:00)</option>
                                <option value="3. Vardiya (00:00 - 08:00)">3. Vardiya (00:00 - 08:00)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Vardiya Ustası</label>
                            <input type="text" id="inputMaster" placeholder="Usta Adı Soyadı" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Fitil Makinesi</label>
                            <select id="selectMachine" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                                <option value="">Makine Seçiniz</option>
                                <script>
                                    for(let i=1; i<=16; i++) {
                                        document.write(`<option value="Fitil - ${i}">Fitil - ${i}</option>`);
                                    }
                                </script>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Operatör</label>
                            <input type="text" id="inputOperator" placeholder="Operatör Adı Soyadı" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Randıman (%)</label>
                            <input type="number" step="0.1" min="0" max="100" id="inputEfficiency" placeholder="Örn: 85.5" required class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-500 mb-1">Açıklama / Not (İsteğe Bağlı)</label>
                            <input type="text" id="inputDescription" placeholder="Varsa arıza veya not..." class="w-full border border-gray-300 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
                            <span id="btnSubmitText">💾 Kaydet ve E-Tablo'ya Gönder</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- KAYITLAR LİSTESİ -->
            <div class="glass-card p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-gray-100">
                    <h3 id="tableHeaderTitle" class="text-sm font-bold text-slate-800 flex items-center gap-2">
                        📋 Son 24 Saat İçindeki Kayıtlar (<span id="myLogCount">0</span>)
                    </h3>
                    <button onclick="fetchUserLogs()" class="text-xs text-indigo-600 hover:text-indigo-800 font-semibold flex items-center gap-1">
                        🔄 Listeyi Yenile
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-center border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-800 text-white font-bold uppercase">
                                <th class="p-2.5">Tarih / Saat</th>
                                <th class="p-2.5">Vardiya</th>
                                <th class="p-2.5">Makine</th>
                                <th class="p-2.5">Operatör</th>
                                <th class="p-2.5">Randıman</th>
                                <th class="p-2.5">Not</th>
                                <th id="thActionHeader" class="p-2.5 hidden">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="userLogsBody" class="divide-y divide-gray-200 font-medium text-slate-700">
                            <tr><td colspan="7" class="p-4 text-gray-400">Yükleniyor...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex flex-col items-center justify-center text-white z-50 hidden">
        <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p id="loadingText" class="font-semibold text-base">İşlem Yapılıyor...</p>
    </div>

    <script>
        const SPREADSHEET_ID = "16tz3byec8CEmoLvT7PJl_tK9rhnHxnl7uyyYEv_yGxI";
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvPLHn7NnmS1Ie5DmyJADDLU-D-VvugQkN8ZTUKsowbv4L1ylzW7SMhRUUdx6tvHLM/exec";

        const USERS = [
            { username: "Hacıkivrak", password: "Karmis123", name: "Hacı Kıvrak", role: "usta" },
            { username: "Ahmetcelik", password: "Karmis123", name: "Ahmet Çelik", role: "usta" },
            { username: "Buraközüdüz", password: "Karmis1881", name: "Burak Özüdüz", role: "admin" },
            { username: "Celilgödeliner", password: "Karmis1881", name: "Celil Gödeliner", role: "admin" },
            { username: "Metehanalbayrak", password: "Karmis1881", name: "Metehan Albayrak", role: "admin" },
            { username: "Yunusekin", password: "Karmis123", name: "Yunus Ekin", role: "usta" },
            { username: "Hüseyinözkaya", password: "Karmis123", name: "Hüseyin Özkaya", role: "usta" }
        ];

        let currentUser = null;
        let globalAllRows = [];

        document.addEventListener("DOMContentLoaded", function() {
            checkSession();
        });

        function checkSession() {
            const savedUser = localStorage.getItem("fitil_active_user");
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                setupPanel();
            } else {
                document.getElementById("loginSection").classList.remove("hidden");
                document.getElementById("appSection").classList.add("hidden");
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const uInput = document.getElementById("loginUsername").value.trim().toLowerCase();
            const pInput = document.getElementById("loginPassword").value.trim();

            const user = USERS.find(u => u.username.toLowerCase() === uInput && u.password === pInput);

            if (user) {
                currentUser = user;
                localStorage.setItem("fitil_active_user", JSON.stringify(user));
                setupPanel();
            } else {
                alert("❌ Hatalı Kullanıcı Adı veya Şifre!");
            }
        }

        function setupPanel() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("appSection").classList.remove("hidden");

            document.getElementById("currentUserSpan").textContent = currentUser.name;
            document.getElementById("userRoleSpan").textContent = currentUser.role === 'admin' ? 'Yönetici' : 'Vardiya Ustası';
            document.getElementById("inputMaster").value = currentUser.name;

            // Rol bazlı üst menü (header) ayarı:
            // Adminler: Veri Girişi, Grafik & Analiz, Matris Raporu, Makineler
            // Ustalar: Veri Girişi, Matris Raporu
            const navContainer = document.getElementById("headerNavLinks");
            let navHtml = `
                <a href="index.html" class="bg-indigo-600 text-white border-2 border-indigo-400 text-xs md:text-sm font-bold px-3.5 py-2 rounded-lg shadow-md flex items-center gap-1.5">
                    📝 Veri Girişi ✓
                </a>
            `;

            if (currentUser.role === 'admin') {
                navHtml += `
                    <a href="rapor.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-md">
                        📈 Grafik & Analiz
                    </a>
                `;
            }

            navHtml += `
                <a href="matris.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-md">
                    📊 Matris Raporu
                </a>
            `;

            if (currentUser.role === 'admin') {
                navHtml += `
                    <a href="makineler.html" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-md">
                        🖥️ Makineler
                    </a>
                `;
            }

            navHtml += `
                <div class="h-6 w-px bg-slate-700 mx-1"></div>
                <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs md:text-sm font-semibold px-3.5 py-2 rounded-lg transition shadow-md">
                    🚪 Çıkış Yap
                </button>
            `;

            navContainer.innerHTML = navHtml;

            if (currentUser.role === 'admin') {
                document.getElementById("tableHeaderTitle").innerHTML = `📋 Son 24 Saat İçindeki Tüm Fabrika Kayıtları (<span id="myLogCount">0</span>)`;
                document.getElementById("thActionHeader").classList.remove("hidden");
            } else {
                document.getElementById("tableHeaderTitle").innerHTML = `📋 Son Girdiğiniz Kayıtlar (<span id="myLogCount">0</span>)`;
                document.getElementById("thActionHeader").classList.add("hidden");
            }

            setInitialDateTime();
            fetchUserLogs();
        }

        function handleLogout() {
            localStorage.removeItem("fitil_active_user");
            currentUser = null;
            location.reload();
        }

        function setInitialDateTime() {
            if (document.getElementById("editRowIndex").value !== "") return;
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            document.getElementById("inputDate").value = `${year}-${month}-${day}`;
            document.getElementById("inputTime").value = `${hours}:${minutes}`;
        }

        function checkShiftDateAdjustment() {
            const shiftVal = document.getElementById("selectShift").value;
            const dateInput = document.getElementById("inputDate");

            if (shiftVal.includes("3. Vardiya")) {
                const currentDate = new Date(dateInput.value || new Date());
                currentDate.setDate(currentDate.getDate() - 1);

                const year = currentDate.getFullYear();
                const month = String(currentDate.getMonth() + 1).padStart(2, '0');
                const day = String(currentDate.getDate()).padStart(2, '0');

                dateInput.value = `${year}-${month}-${day}`;
            }
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editIndex = document.getElementById("editRowIndex").value;
            const isEditing = editIndex !== "";

            showLoading(true, isEditing ? "Kayıt Güncelleniyor..." : "E-Tablo'ya Kaydediliyor...");

            const formData = {
                action: isEditing ? "update" : "insert",
                rowIndex: editIndex,
                date: document.getElementById("inputDate").value,
                time: document.getElementById("inputTime").value,
                shift: document.getElementById("selectShift").value,
                master: document.getElementById("inputMaster").value,
                machine: document.getElementById("selectMachine").value,
                operator: document.getElementById("inputOperator").value,
                efficiency: document.getElementById("inputEfficiency").value,
                description: document.getElementById("inputDescription").value || "-",
                username: currentUser ? currentUser.username : "-"
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(formData)
            })
            .then(() => {
                showLoading(false);
                showSuccessBanner(isEditing ? "Kayıt başarıyla güncellendi!" : "Veri başarıyla kaydedildi ve alt listeye eklendi!");

                cancelEditMode();
                setTimeout(fetchUserLogs, 2500);
            })
            .catch(err => {
                console.error("Kayıt Hatası:", err);
                showLoading(false);
                alert("❌ İşlem sırasında bir hata oluştu.");
            });
        }

        function editRecord(index) {
            const item = globalAllRows[index];
            if (!item) return;

            document.getElementById("editRowIndex").value = item.sheetRowIndex;
            document.getElementById("inputDate").value = item.dateStr;
            document.getElementById("inputTime").value = item.timeStr;
            document.getElementById("selectShift").value = item.shift;
            document.getElementById("inputMaster").value = item.master;
            document.getElementById("selectMachine").value = item.machine;
            document.getElementById("inputOperator").value = item.operator;
            document.getElementById("inputEfficiency").value = item.efficiency;
            document.getElementById("inputDescription").value = item.description === "-" ? "" : item.description;

            document.getElementById("formTitle").textContent = `✏️ Kaydı Düzenle (Satır #${item.sheetRowIndex})`;
            document.getElementById("btnSubmitText").textContent = "💾 Güncellemeyi Kaydet";
            document.getElementById("btnCancelEdit").classList.remove("hidden");

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEditMode() {
            document.getElementById("editRowIndex").value = "";
            document.getElementById("formTitle").textContent = "📌 Randıman Kayıt Formu";
            document.getElementById("btnSubmitText").textContent = "💾 Kaydet ve E-Tablo'ya Gönder";
            document.getElementById("btnCancelEdit").classList.add("hidden");
            document.getElementById("entryForm").reset();
            document.getElementById("inputMaster").value = currentUser.name;
            setInitialDateTime();
        }

        function showSuccessBanner(msg) {
            const banner = document.getElementById("successBanner");
            document.getElementById("successMessage").textContent = msg;
            banner.classList.remove("hidden");
            setTimeout(() => { banner.classList.add("hidden"); }, 4000);
        }

        function fetchUserLogs() {
            if (!currentUser) return;
            const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:json&cacheBust=` + new Date().getTime();

            fetch(url)
                .then(res => res.text())
                .then(rep => {
                    const jsonString = rep.substring(47, rep.length - 2);
                    const json = JSON.parse(jsonString);
                    parseUserLogs(json.table.rows);
                })
                .catch(err => console.error("Kayıtlar çekilemedi:", err));
        }

        function parseUserLogs(rows) {
            const tbody = document.getElementById("userLogsBody");
            tbody.innerHTML = "";
            globalAllRows = [];
            let displayedEntries = [];

            const nowTime = new Date().getTime();
            const twentyFourHoursMs = 24 * 60 * 60 * 1000;

            if (rows) {
                rows.forEach((r, idx) => {
                    const c = r.c;
                    if (c && c[0] && c[0].v !== null) {
                        let rawDate = c[0].f || c[0].v;
                        if (typeof rawDate === 'string' && rawDate.includes("Date(")) {
                            const dateParts = rawDate.match(/\d+/g);
                            if (dateParts) {
                                rawDate = `${dateParts[0]}-${String(parseInt(dateParts[1]) + 1).padStart(2, '0')}-${String(dateParts[2]).padStart(2, '0')}`;
                            }
                        }

                        const dateStr = String(rawDate).split('T')[0];
                        const timeStr = c[1] ? String(c[1].v) : "00:00";
                        
                        let recordTimestamp = new Date(`${dateStr}T${timeStr.length === 5 ? timeStr : '00:00'}`).getTime();
                        if (isNaN(recordTimestamp)) {
                            recordTimestamp = new Date(dateStr).getTime();
                        }

                        const recordUser = c[8] ? String(c[8].v).trim().toLowerCase() : "";
                        const recordMaster = c[3] ? String(c[3].v).trim().toLowerCase() : "";
                        const currentUName = currentUser.username.toLowerCase();
                        const currentMName = currentUser.name.toLowerCase();

                        const itemObj = {
                            sheetRowIndex: idx + 2,
                            dateStr: dateStr,
                            timeStr: timeStr,
                            shift: c[2] ? c[2].v : "-",
                            master: c[3] ? c[3].v : "-",
                            machine: c[4] ? c[4].v : "-",
                            operator: c[5] ? c[5].v : "-",
                            efficiency: c[6] ? parseFloat(c[6].v) || 0 : 0,
                            description: c[7] ? c[7].v : "-"
                        };

                        globalAllRows.push(itemObj);

                        const isWithin24Hours = (nowTime - recordTimestamp) <= twentyFourHoursMs;

                        if (currentUser.role === 'admin') {
                            if (isWithin24Hours) {
                                displayedEntries.push(itemObj);
                            }
                        } else {
                            if (recordUser === currentUName || recordMaster === currentMName) {
                                displayedEntries.push(itemObj);
                            }
                        }
                    }
                });
            }

            document.getElementById("myLogCount").textContent = displayedEntries.length;

            if (displayedEntries.length === 0) {
                const colSpan = currentUser.role === 'admin' ? 7 : 6;
                tbody.innerHTML = `<tr><td colspan="${colSpan}" class="p-4 text-gray-400">Son 24 saat içinde kayıt bulunmuyor.</td></tr>`;
                return;
            }

            displayedEntries.reverse().forEach(item => {
                let badgeClass = "text-emerald-600 bg-emerald-50";
                if (item.efficiency < 60) badgeClass = "text-rose-600 bg-rose-50";
                else if (item.efficiency < 70) badgeClass = "text-amber-600 bg-amber-50";

                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-50 transition border-b border-gray-100";
                
                let rowHtml = `
                    <td class="p-2.5 font-semibold text-slate-700">${item.dateStr} <span class="text-[10px] text-gray-400 block">${item.timeStr}</span></td>
                    <td class="p-2.5 text-gray-600">${item.shift.split(' ')[0]} Vardiya</td>
                    <td class="p-2.5 font-bold text-slate-800">${item.machine}</td>
                    <td class="p-2.5 text-gray-600">${item.operator}</td>
                    <td class="p-2.5"><span class="px-2 py-0.5 rounded-md font-bold ${badgeClass}">%${item.efficiency.toFixed(1)}</span></td>
                    <td class="p-2.5 text-gray-500 italic max-w-[120px] truncate" title="${item.description}">${item.description}</td>
                `;

                if (currentUser.role === 'admin') {
                    const originalIndex = globalAllRows.findIndex(x => x.sheetRowIndex === item.sheetRowIndex);
                    rowHtml += `
                        <td class="p-2.5">
                            <button type="button" onclick="editRecord(${originalIndex})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 p-1.5 rounded-lg transition font-bold" title="Bu kaydı düzenle">
                                ✏️
                            </button>
                        </td>
                    `;
                }

                tr.innerHTML = rowHtml;
                tbody.appendChild(tr);
            });
        }

        function showLoading(show, text = "") {
            const overlay = document.getElementById("loadingOverlay");
            document.getElementById("loadingText").textContent = text;
            overlay.classList.toggle("hidden", !show);
        }
    </script>
</body>
</html>
